name: Notify kodi-addons on release

on:
  push:
    tags:
      - "v*"

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger publish workflow in neverbot/kodi-addons
        env:
          TOKEN: ${{ secrets.KODI_REPO_DISPATCH_TOKEN }}
          TAG:   ${{ github.ref_name }}
          REPO:  ${{ github.repository }}
        run: |
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/neverbot/kodi-addons/dispatches \
            -d "{\"event_type\":\"addon-released\",\"client_payload\":{\"repo\":\"$REPO\",\"tag\":\"$TAG\"}}"
